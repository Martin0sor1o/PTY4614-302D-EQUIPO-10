# Blueprint de Render para la demo de Big Curvas (planes gratuitos). Guía: big-curvas/docs/DEPLOY_RENDER.md
# Va en la raíz del repositorio (requisito de Render); la app vive en la subcarpeta big-curvas/.
# Sin secretos: DATABASE_URL la entrega la base de datos de Render.

databases:
  - name: big-curvas-db
    databaseName: big_curvas
    user: bigcurvas
    region: oregon
    plan: free

services:
  - type: web
    name: big-curvas-demo
    runtime: node
    region: oregon
    plan: free
    branch: feature/demo
    rootDir: big-curvas
    autoDeployTrigger: commit
    # "corepack pnpm" ejecuta el pnpm fijado en package.json ("packageManager") sin instalar enlaces: en Render
    # /usr/bin es de solo lectura, así que "corepack enable" falla. Se instalan también las devDependencies
    # (Next, TypeScript, Tailwind y Prisma las necesitan para compilar) aunque NODE_ENV sea production.
    buildCommand: corepack pnpm install --frozen-lockfile --prod=false && corepack pnpm build
    # Las migraciones y la siembra van en el arranque: el plan gratuito no tiene "pre-deploy command".
    # demo:bootstrap solo siembra si la base está vacía (primera vez); en los demás arranques no hace nada.
    startCommand: corepack pnpm db:deploy && corepack pnpm demo:bootstrap && corepack pnpm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DEMO_MODE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: big-curvas-db
          property: connectionString
